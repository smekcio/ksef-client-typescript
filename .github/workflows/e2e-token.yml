name: E2E Auth Flows

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-auth-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test-token:
    name: TEST token flow
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      KSEF_ENV: TEST
      KSEF_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}
      KSEF_CONTEXT_TYPE: ${{ secrets.KSEF_TEST_CONTEXT_TYPE }}
      KSEF_CONTEXT_VALUE: ${{ secrets.KSEF_TEST_CONTEXT_VALUE }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask required secrets
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(KSEF_TOKEN KSEF_CONTEXT_TYPE KSEF_CONTEXT_VALUE)
          for var_name in "${required_vars[@]}"; do
            value="${!var_name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret for $var_name in TEST flow."
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Run lightweight e2e connect test
        run: |
          npm run build
          node --test test/e2e/connect.test.js

  e2e-demo-token:
    name: DEMO token flow
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      KSEF_ENV: DEMO
      KSEF_TOKEN: ${{ secrets.KSEF_DEMO_TOKEN }}
      KSEF_CONTEXT_TYPE: ${{ secrets.KSEF_DEMO_CONTEXT_TYPE }}
      KSEF_CONTEXT_VALUE: ${{ secrets.KSEF_DEMO_CONTEXT_VALUE }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask required secrets
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(KSEF_TOKEN KSEF_CONTEXT_TYPE KSEF_CONTEXT_VALUE)
          for var_name in "${required_vars[@]}"; do
            value="${!var_name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret for $var_name in DEMO flow."
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Run lightweight e2e connect test
        run: |
          npm run build
          node --test test/e2e/connect.test.js

  e2e-test-xades:
    name: TEST XAdES flow
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KSEF_ENV: TEST
      KSEF_CONTEXT_TYPE: ${{ secrets.KSEF_TEST_CONTEXT_TYPE }}
      KSEF_CONTEXT_VALUE: ${{ secrets.KSEF_TEST_CONTEXT_VALUE }}
      KSEF_XADES_CERT_CRT: ${{ secrets.KSEF_TEST_XADES_CERT_CRT }}
      KSEF_XADES_CERT_CRT_B64: ${{ secrets.KSEF_TEST_XADES_CERT_CRT_B64 }}
      KSEF_XADES_PRIVATE_KEY_PEM: ${{ secrets.KSEF_TEST_XADES_PRIVATE_KEY_PEM }}
      KSEF_XADES_PRIVATE_KEY_PEM_B64: ${{ secrets.KSEF_TEST_XADES_PRIVATE_KEY_PEM_B64 }}
      KSEF_XADES_PRIVATE_KEY_PASSWORD: ${{ secrets.KSEF_TEST_XADES_PRIVATE_KEY_PASSWORD }}
      KSEF_XADES_SUBJECT_IDENTIFIER_TYPE: certificateSubject
      KSEF_XADES_ENFORCE_COMPLIANCE: "1"

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask required secrets
        shell: bash
        run: |
          set -euo pipefail

          required_context=(KSEF_CONTEXT_TYPE KSEF_CONTEXT_VALUE)
          for var_name in "${required_context[@]}"; do
            value="${!var_name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret for $var_name in TEST XAdES flow."
              exit 1
            fi
          done

          if [ -z "${KSEF_XADES_CERT_CRT:-}" ] && [ -z "${KSEF_XADES_CERT_CRT_B64:-}" ]; then
            echo "::error::Missing KSEF_TEST_XADES_CERT_CRT or KSEF_TEST_XADES_CERT_CRT_B64."
            exit 1
          fi

          if [ -z "${KSEF_XADES_PRIVATE_KEY_PEM:-}" ] && [ -z "${KSEF_XADES_PRIVATE_KEY_PEM_B64:-}" ]; then
            echo "::error::Missing KSEF_TEST_XADES_PRIVATE_KEY_PEM or KSEF_TEST_XADES_PRIVATE_KEY_PEM_B64."
            exit 1
          fi

          to_mask=(
            "${KSEF_CONTEXT_TYPE:-}"
            "${KSEF_CONTEXT_VALUE:-}"
            "${KSEF_XADES_CERT_CRT:-}"
            "${KSEF_XADES_CERT_CRT_B64:-}"
            "${KSEF_XADES_PRIVATE_KEY_PEM:-}"
            "${KSEF_XADES_PRIVATE_KEY_PEM_B64:-}"
            "${KSEF_XADES_PRIVATE_KEY_PASSWORD:-}"
          )
          for value in "${to_mask[@]}"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Run lightweight e2e xades auth test
        run: |
          npm run build
          node --test test/e2e/xades-auth.test.js

  e2e-demo-xades:
    name: DEMO XAdES flow
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KSEF_ENV: DEMO
      KSEF_CONTEXT_TYPE: ${{ secrets.KSEF_DEMO_CONTEXT_TYPE }}
      KSEF_CONTEXT_VALUE: ${{ secrets.KSEF_DEMO_CONTEXT_VALUE }}
      KSEF_XADES_CERT_CRT: ${{ secrets.KSEF_DEMO_XADES_CERT_CRT }}
      KSEF_XADES_CERT_CRT_B64: ${{ secrets.KSEF_DEMO_XADES_CERT_CRT_B64 }}
      KSEF_XADES_PRIVATE_KEY_PEM: ${{ secrets.KSEF_DEMO_XADES_PRIVATE_KEY_PEM }}
      KSEF_XADES_PRIVATE_KEY_PEM_B64: ${{ secrets.KSEF_DEMO_XADES_PRIVATE_KEY_PEM_B64 }}
      KSEF_XADES_PRIVATE_KEY_PASSWORD: ${{ secrets.KSEF_DEMO_XADES_PRIVATE_KEY_PASSWORD }}
      KSEF_XADES_SUBJECT_IDENTIFIER_TYPE: certificateSubject
      KSEF_XADES_ENFORCE_COMPLIANCE: "1"

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask required secrets
        shell: bash
        run: |
          set -euo pipefail

          required_context=(KSEF_CONTEXT_TYPE KSEF_CONTEXT_VALUE)
          for var_name in "${required_context[@]}"; do
            value="${!var_name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret for $var_name in DEMO XAdES flow."
              exit 1
            fi
          done

          if [ -z "${KSEF_XADES_CERT_CRT:-}" ] && [ -z "${KSEF_XADES_CERT_CRT_B64:-}" ]; then
            echo "::error::Missing KSEF_DEMO_XADES_CERT_CRT or KSEF_DEMO_XADES_CERT_CRT_B64."
            exit 1
          fi

          if [ -z "${KSEF_XADES_PRIVATE_KEY_PEM:-}" ] && [ -z "${KSEF_XADES_PRIVATE_KEY_PEM_B64:-}" ]; then
            echo "::error::Missing KSEF_DEMO_XADES_PRIVATE_KEY_PEM or KSEF_DEMO_XADES_PRIVATE_KEY_PEM_B64."
            exit 1
          fi

          to_mask=(
            "${KSEF_CONTEXT_TYPE:-}"
            "${KSEF_CONTEXT_VALUE:-}"
            "${KSEF_XADES_CERT_CRT:-}"
            "${KSEF_XADES_CERT_CRT_B64:-}"
            "${KSEF_XADES_PRIVATE_KEY_PEM:-}"
            "${KSEF_XADES_PRIVATE_KEY_PEM_B64:-}"
            "${KSEF_XADES_PRIVATE_KEY_PASSWORD:-}"
          )
          for value in "${to_mask[@]}"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Run lightweight e2e xades auth test
        run: |
          npm run build
          node --test test/e2e/xades-auth.test.js

  notify-scheduled-failure:
    name: Notify Scheduled E2E Failure
    runs-on: ubuntu-latest
    needs:
      - e2e-test-token
      - e2e-test-xades
      - e2e-demo-token
      - e2e-demo-xades
    if: ${{ always() && github.event_name == 'schedule' && (needs.e2e-test-token.result == 'failure' || needs.e2e-test-xades.result == 'failure' || needs.e2e-demo-token.result == 'failure' || needs.e2e-demo-xades.result == 'failure') }}

    steps:
      - name: Create or update GitHub issue
        uses: actions/github-script@v7
        env:
          RESULT_TEST_TOKEN: ${{ needs.e2e-test-token.result }}
          RESULT_TEST_XADES: ${{ needs.e2e-test-xades.result }}
          RESULT_DEMO_TOKEN: ${{ needs.e2e-demo-token.result }}
          RESULT_DEMO_XADES: ${{ needs.e2e-demo-xades.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[CI] Scheduled TypeScript E2E failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const body = [
              "Daily scheduled TypeScript E2E workflow failed.",
              "",
              `- workflow: \`${context.workflow}\``,
              `- run: ${runUrl}`,
              `- event: \`${context.eventName}\``,
              `- timestamp (UTC): \`${now}\``,
              "",
              "Job results:",
              `- TEST token flow: \`${process.env.RESULT_TEST_TOKEN}\``,
              `- TEST XAdES flow: \`${process.env.RESULT_TEST_XADES}\``,
              `- DEMO token flow: \`${process.env.RESULT_DEMO_TOKEN}\``,
              `- DEMO XAdES flow: \`${process.env.RESULT_DEMO_XADES}\``,
            ].join("\n");

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                assignees: ["smekcio"],
              });
            }
