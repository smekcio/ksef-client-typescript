name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or tag to publish. Defaults to the release tag or current ref.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve publish ref
        id: target
        shell: bash
        run: |
          ref="${{ github.event.release.tag_name || inputs.ref || github.ref }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          case "$ref" in
            refs/tags/*)
              echo "tag=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout publish ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches release tag
        if: steps.target.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG.startsWith('v')
            ? process.env.RELEASE_TAG.slice(1)
            : process.env.RELEASE_TAG;
          if (pkg.version !== tag) {
            console.error(\`package.json version (\${pkg.version}) does not match release tag (\${tag})\`);
            process.exit(1);
          }
          console.log(\`OK: \${pkg.version} == \${tag}\`);
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack --dry-run

      - name: Setup Node.js 24 for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish with Trusted Publishing
        run: npm publish --access public
