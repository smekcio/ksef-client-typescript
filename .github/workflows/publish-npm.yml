name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Authentication mode for npm publish
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack --dry-run

      - name: Prepare auth for Trusted Publishing
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_mode == 'trusted' }}
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish with Trusted Publishing
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_mode == 'trusted' }}
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --provenance

      - name: Publish with NPM token
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_mode == 'token' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not configured."
            exit 1
          fi
          npm publish --access public --provenance
