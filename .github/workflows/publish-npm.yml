name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Authentication mode for npm publish
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        if: github.event_name != 'workflow_dispatch'
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const rawTag = process.env.GITHUB_REF_NAME ?? '';
          const tag = rawTag.startsWith('v') ? rawTag.slice(1) : rawTag;
          if (pkg.version !== tag) {
            console.error(`package.json version (${pkg.version}) does not match tag (${tag})`);
            process.exit(1);
          }
          console.log(`OK: ${pkg.version} == ${tag}`);
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack --dry-run

      - name: Publish with Trusted Publishing
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_mode == 'trusted' }}
        run: npm publish --access public --provenance

      - name: Publish with NPM token
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_mode == 'token' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not configured."
            exit 1
          fi
          npm publish --access public --provenance
