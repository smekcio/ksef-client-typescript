name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native build deps for optional libxmljs2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests with coverage
        run: >
          NODE_OPTIONS=--enable-source-maps npm exec -- c8 --exclude-after-remap --reporter=text-summary --reporter=text --reporter=lcov --reporter=html
          sh -lc 'node --test $(find test/unit -name "*.test.js" ! -name "cliArgs.test.js" ! -name "cliTokenStore.test.js" -print) test/e2e/*.test.js'

      - name: Enforce coverage threshold
        run: npm exec -- c8 check-coverage --exclude-after-remap --statements 100 --branches 100 --functions 100 --lines 100

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-20
          path: |
            coverage/

  test-matrix:
    name: Test (Node ${{ matrix.node-version }})
    if: github.event_name != 'pull_request'
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            experimental: false
          - node-version: 24
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
